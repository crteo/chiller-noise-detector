<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Chiller Plant Noise Sensor</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #0f172a;
      color: #f8fafc;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .container {
      width: 100%;
      max-width: 460px;
      margin: 0 auto;
    }

    .card {
      margin-top: 20px;
      padding: 24px;
      background: #1e293b;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgb(0 0 0 / 25%);
    }

    h1 {
      margin-top: 0;
      font-size: 26px;
    }

    .estimated-value {
      margin-top: 24px;
      font-size: 72px;
      font-weight: bold;
      line-height: 1;
    }

    .estimated-unit {
      margin-top: 8px;
      color: #cbd5e1;
      font-size: 20px;
    }

    .condition {
      margin: 20px 0;
      font-size: 24px;
      font-weight: bold;
      color: #94a3b8;
    }

    .meter {
      height: 28px;
      overflow: hidden;
      margin: 20px 0;
      background: #334155;
      border-radius: 20px;
    }

    .meter-bar {
      width: 0%;
      height: 100%;
      background: #22c55e;
      transition:
        width 0.25s ease,
        background-color 0.25s ease;
    }

    .details {
      margin-top: 22px;
      padding: 16px;
      background: #0f172a;
      border-radius: 10px;
      text-align: left;
      line-height: 1.8;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      gap: 20px;
    }

    .detail-label {
      color: #94a3b8;
    }

    .calibration {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #475569;
    }

    .calibration label {
      display: block;
      margin-bottom: 8px;
      color: #cbd5e1;
    }

    .calibration-control {
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .calibration input {
      width: 100px;
      padding: 10px;
      border: 1px solid #64748b;
      border-radius: 8px;
      background: #0f172a;
      color: white;
      font-size: 18px;
      text-align: center;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 15px;
      border: 0;
      border-radius: 10px;
      background: #22c55e;
      color: #052e16;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #475569;
      color: #cbd5e1;
      cursor: not-allowed;
    }

    .status {
      margin-top: 18px;
      color: #94a3b8;
      font-size: 15px;
    }

    .warning {
      margin-top: 20px;
      padding: 12px;
      border: 1px solid #f59e0b;
      border-radius: 8px;
      background: rgb(245 158 11 / 10%);
      color: #fcd34d;
      font-size: 13px;
      line-height: 1.5;
      text-align: left;
    }
  </style>
</head>

<body>
  <main class="container">
    <section class="card">
      <h1>Chiller Plant Noise Sensor</h1>

      <div id="estimatedValue" class="estimated-value">--</div>
      <div class="estimated-unit">estimated dB(A)</div>

      <div id="condition" class="condition">
        Monitoring stopped
      </div>

      <div class="meter">
        <div id="meterBar" class="meter-bar"></div>
      </div>

      <div class="details">
        <div class="detail-row">
          <span class="detail-label">Raw level</span>
          <span><span id="rawValue">--</span> dBFS</span>
        </div>

        <div class="detail-row">
          <span class="detail-label">Peak</span>
          <span><span id="peakValue">--</span> dBFS</span>
        </div>

        <div class="detail-row">
          <span class="detail-label">Server</span>
          <span id="serverStatus">Connecting</span>
        </div>

        <div class="detail-row">
          <span class="detail-label">Last sent</span>
          <span id="lastSent">--</span>
        </div>
      </div>

      <div class="calibration">
        <label for="calibrationOffset">
          Calibration offset
        </label>

        <div class="calibration-control">
          <input
            id="calibrationOffset"
            type="number"
            min="80"
            max="140"
            step="0.1"
            value="110"
          />

          <span style="align-self: center;">dB</span>
        </div>
      </div>

      <button id="startButton">
        Start monitoring
      </button>

      <p id="microphoneStatus" class="status">
        Microphone stopped
      </p>

      <div class="warning">
        This is an uncalibrated phone estimate and must not be
        used for occupational-noise compliance or hearing-protection
        decisions.
      </div>
    </section>
  </main>

  <script src="/socket.io/socket.io.js"></script>

  <script>
    const DEVICE_ID = "chiller-plant-phone-01";
    const READING_INTERVAL_MS = 500;
    const DEFAULT_CALIBRATION_OFFSET = 110;

    const estimatedValueElement =
      document.getElementById("estimatedValue");

    const rawValueElement =
      document.getElementById("rawValue");

    const peakValueElement =
      document.getElementById("peakValue");

    const conditionElement =
      document.getElementById("condition");

    const meterBarElement =
      document.getElementById("meterBar");

    const serverStatusElement =
      document.getElementById("serverStatus");

    const lastSentElement =
      document.getElementById("lastSent");

    const microphoneStatusElement =
      document.getElementById("microphoneStatus");

    const calibrationInput =
      document.getElementById("calibrationOffset");

    const startButton =
      document.getElementById("startButton");

    const socket = io();

    let monitoring = false;
    let audioContext = null;
    let microphoneStream = null;
    let measurementTimer = null;

    /*
     * Restore the calibration value previously saved on this phone.
     */
    const savedOffset = Number(
      localStorage.getItem("noiseCalibrationOffset")
    );

    if (
      Number.isFinite(savedOffset) &&
      savedOffset >= 80 &&
      savedOffset <= 140
    ) {
      calibrationInput.value = savedOffset;
    } else {
      calibrationInput.value = DEFAULT_CALIBRATION_OFFSET;
    }

    calibrationInput.addEventListener("change", () => {
      let offset = Number(calibrationInput.value);

      if (!Number.isFinite(offset)) {
        offset = DEFAULT_CALIBRATION_OFFSET;
      }

      offset = Math.max(80, Math.min(140, offset));

      calibrationInput.value = offset;
      localStorage.setItem(
        "noiseCalibrationOffset",
        String(offset)
      );
    });

    socket.on("connect", () => {
      serverStatusElement.textContent = "Connected";

      if (monitoring) {
        microphoneStatusElement.textContent =
          "Microphone active — server connected";
      }
    });

    socket.on("disconnect", () => {
      serverStatusElement.textContent = "Disconnected";

      if (monitoring) {
        microphoneStatusElement.textContent =
          "Microphone active — waiting for server";
      }
    });

    socket.on("connect_error", () => {
      serverStatusElement.textContent = "Connection error";
    });

    function clamp(value, minimum, maximum) {
      return Math.max(minimum, Math.min(maximum, value));
    }

    function amplitudeToDbfs(amplitude) {
      if (amplitude <= 0) {
        return -100;
      }

      return clamp(
        20 * Math.log10(amplitude),
        -100,
        0
      );
    }

    function getCalibrationOffset() {
      const offset = Number(calibrationInput.value);

      if (!Number.isFinite(offset)) {
        return DEFAULT_CALIBRATION_OFFSET;
      }

      return offset;
    }

    function updateCondition(estimatedDbA) {
      let condition;
      let colour;

      if (estimatedDbA >= 90) {
        condition = "Very high";
        colour = "#ef4444";
      } else if (estimatedDbA >= 80) {
        condition = "High";
        colour = "#f97316";
      } else if (estimatedDbA >= 70) {
        condition = "Elevated";
        colour = "#f59e0b";
      } else {
        condition = "Normal";
        colour = "#22c55e";
      }

      conditionElement.textContent = condition;
      conditionElement.style.color = colour;
      meterBarElement.style.backgroundColor = colour;
    }

    function updateMeter(estimatedDbA) {
      /*
       * Visual range:
       * 40 estimated dB(A) = 0%
       * 110 estimated dB(A) = 100%
       */
      const minimumDisplayDb = 40;
      const maximumDisplayDb = 110;

      const percentage =
        ((estimatedDbA - minimumDisplayDb) /
          (maximumDisplayDb - minimumDisplayDb)) *
        100;

      meterBarElement.style.width =
        clamp(percentage, 0, 100) + "%";
    }

    async function startMonitoring() {
      if (monitoring) {
        return;
      }

      if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
      ) {
        microphoneStatusElement.textContent =
          "Microphone access is not supported. Use HTTPS.";

        return;
      }

      startButton.disabled = true;
      startButton.textContent = "Starting…";

      try {
        microphoneStream =
          await navigator.mediaDevices.getUserMedia({
            audio: {
              echoCancellation: false,
              noiseSuppression: false,
              autoGainControl: false
            }
          });

        audioContext = new AudioContext();

        if (audioContext.state === "suspended") {
          await audioContext.resume();
        }

        const source =
          audioContext.createMediaStreamSource(
            microphoneStream
          );

        const analyser =
          audioContext.createAnalyser();

        analyser.fftSize = 4096;
        analyser.smoothingTimeConstant = 0.3;

        source.connect(analyser);

        const samples =
          new Float32Array(analyser.fftSize);

        monitoring = true;

        startButton.textContent = "Monitoring active";
        microphoneStatusElement.textContent =
          socket.connected
            ? "Microphone active — server connected"
            : "Microphone active — waiting for server";

        measurementTimer = setInterval(() => {
          analyser.getFloatTimeDomainData(samples);

          let sumSquares = 0;
          let peakAmplitude = 0;

          for (const sample of samples) {
            sumSquares += sample * sample;

            peakAmplitude = Math.max(
              peakAmplitude,
              Math.abs(sample)
            );
          }

          const rms =
            Math.sqrt(sumSquares / samples.length);

          const levelDbfs =
            amplitudeToDbfs(rms);

          const peakDbfs =
            amplitudeToDbfs(peakAmplitude);

          const calibrationOffset =
            getCalibrationOffset();

          /*
           * This is an approximate calibrated value.
           * It is not a certified acoustic measurement.
           */
          const estimatedDbA =
            levelDbfs + calibrationOffset;

          estimatedValueElement.textContent =
            estimatedDbA.toFixed(1);

          rawValueElement.textContent =
            levelDbfs.toFixed(1);

          peakValueElement.textContent =
            peakDbfs.toFixed(1);

          updateCondition(estimatedDbA);
          updateMeter(estimatedDbA);

          /*
           * Avoid building up a large queue of readings if the
           * server or Wi-Fi connection is unavailable.
           */
          if (socket.connected) {
            socket.emit("noise-reading", {
              deviceId: DEVICE_ID,
              levelDbfs,
              peakDbfs,
              estimatedDbA,
              calibrationOffset
            });

            lastSentElement.textContent =
              new Date().toLocaleTimeString();
          }
        }, READING_INTERVAL_MS);
      } catch (error) {
        console.error(error);

        startButton.disabled = false;
        startButton.textContent = "Try again";

        microphoneStatusElement.textContent =
          "Microphone error: " + error.message;
      }
    }

    startButton.addEventListener(
      "click",
      startMonitoring
    );

    /*
     * Stop the microphone cleanly if the page is closed.
     */
    window.addEventListener("beforeunload", () => {
      if (measurementTimer) {
        clearInterval(measurementTimer);
      }

      if (microphoneStream) {
        for (const track of microphoneStream.getTracks()) {
          track.stop();
        }
      }

      if (audioContext) {
        audioContext.close();
      }
    });
  </script>
</body>
</html>
